aid: university-of-reading
name: University of Reading
x-type: university
x-category: Public Research University
description: >-
  The University of Reading is a public research university in Reading, England, founded in 1926 and
  ranked #172 in the QS World University Rankings 2025. Its programmable footprint is small, real,
  and almost entirely scholarly: two OAI-PMH 2.0 harvesting endpoints on its own hosts — CentAUR
  (64,458 research outputs) and the Research Data Archive — plus the read-only EPrints dataset
  listings beside them. Both were probed live on 2026-09-01 and both are fully open, with no key, no
  registration and no advertised rate limit. There is no developer portal, no api.reading.ac.uk, no
  open-data portal and no OpenAPI, AsyncAPI or apis.json document published by the university
  anywhere. The institution does operate an Azure API Management gateway on its own domain
  (esb-prod-api.reading.ac.uk) but publishes no route through it. Its strongest institution-operated
  machine-readable surface after the repositories is identity: a SAML entity in the UK Access
  Management Federation (entityID https://reading.ac.uk/oala/metadata, scoped reading.ac.uk and
  reading.edu.my) and a Microsoft Entra ID tenant whose OpenID Connect discovery document is public.
  It is a registered DataCite member (provider PCLW) and holds a ROR identifier. Almost everything
  else a reader might mistake for a Reading API is a vendor's contract running under the
  university's name — Elsevier Pure, Talis Aspire, SirsiDynix Enterprise, ProQuest Summon,
  Springshare LibGuides — and those are recorded here as tenant relationships, not as the
  university's engineering.
