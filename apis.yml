x-coverage:
  state: covered
  reason: covered
  generated: '2026-09-01'
  method: probed
  detail: >-
    Every surface class the university pipeline hunts was probed on 2026-09-01 and the result is a
    small but complete and honest profile. Two institution-operated machine-readable APIs exist and
    both work: the OAI-PMH 2.0 endpoints for CentAUR (64,458 records) and the Research Data Archive,
    open with no credentials, alongside the read-only EPrints /rest/ listings whose per-record XML
    returns 401. There is no developer portal and no open-data portal — api.reading.ac.uk,
    data.reading.ac.uk, opendata.reading.ac.uk and developer.reading.ac.uk do not resolve at all,
    and www.reading.ac.uk/llms.txt and /.well-known/security.txt both 404. The university does run an
    Azure API Management gateway on its own domain (esb-prod-api.reading.ac.uk, resolving to
    uks-common-p-001-apim.azure-api.net, with a UAT sibling) but every path probed returns APIM's
    JSON 404 envelope: a gateway with no published route. Identity is the strongest find — a UK
    Access Management Federation SAML entity, entityID https://reading.ac.uk/oala/metadata, whose
    metadata is live in the federation MDQ, plus a public Entra ID OIDC discovery document. Registry
    memberships are real and recorded: DataCite provider PCLW with four DOI prefixes, and ROR
    05v62cm79. The course catalogue and the Meteorology Department's climate data services are
    genuinely institution-operated and genuinely public, but both are HTML-only — the module
    catalogue is server-rendered with no JSON, and the climate services are multi-step POST form
    wizards, with the newer Data Extractor still showing a 2018 "no data available yet" banner.
    Library discovery, reading lists, LibGuides, the CRIS and timetabling are all vendor tenancies
    and are recorded as relationships, never as Reading's contracts; no Figshare tenancy exists —
    reading.figshare.com returns the same AWS WAF challenge as a nonsense subdomain does, so the
    apparent host is not evidence. Two measurement traps worth naming: /cgi/search and /cgi/export on
    centaur.reading.ac.uk answer HTTP 200 with an Anubis bot interstitial rather than the requested
    document, and www.reading.ac.uk serves its 404s from /search/404.htm with a correct 404 status.
