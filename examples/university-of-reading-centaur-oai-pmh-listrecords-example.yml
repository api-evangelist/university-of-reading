            <dc:relation>https://centaur.reading.ac.uk/2/</dc:relation>
            <dc:title>Filter for Car Tracking Based on Acceleration and Steering Angle</dc:title>
            <dc:creator>Maybank, S.J.</dc:creator>
            <dc:creator>Worrall, A.D</dc:creator>
            <dc:creator>Sullivan, G.D.</dc:creator>
            <dc:subject>004 Data processing &amp; computer science</dc:subject>
            <dc:subject>005 Computer programming, programs &amp; data</dc:subject>
            <dc:description>The motion of a car is described using a stochastic model in which the driving processes are the steering angle and the tangential acceleration. The model incorporates exactly the kinematic constraint that the wheels do not slip sideways. Two filters based on this model have been implemented, namely the standard EKF, and a new filter (the CUF) in which the expectation and the covariance of the system state are propagated accurately. Experiments show that i) the CUF is better than the EKF at predicting future positions of the car; and ii) the filter outputs can be used to control the measurement process, leading to improved ability to recover from errors in predictive tracking.</dc:description>
