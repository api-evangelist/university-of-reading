            <content>
              <text>1. This is an institutional or departmental repository.
    2. The repository is restricted to:
       (a) Journal articles
       (b) Bibliographic references
       (c) Conference and workshop papers
       (d) Theses
       (e) Unpublished reports and working papers
       (f) Books, chapters and sections
       (g) Datasets
       (h) Multimedia and audio-visual materials
       (i) Patents
       (j) Other special item types
       (k) Special materials: Exhibitions, Designs
    3. Deposited items may include:
       (a) submitted versions (as sent to journals for peer-review)
       (b) accepted versions (author's final peer-reviewed drafts)
       (c) published versions (publisher-created files)
    4. Items are individually tagged with:
       (a) their version type and date.
       (b) their peer-review status.
       (c) their publication status.
    5. Principal Languages: English
    </text>
