            <metadataPolicy>
              <text>1. Anyone may access the metadata free of charge.
    2. The metadata may be re-used in any medium without prior permission
    for not-for-profit purposes
    3. The metadata must not be re-used in any medium for commercial
    purposes without formal permission.
    </text>
            </metadataPolicy>
            <dataPolicy>
              <text>1. Anyone may access full items free of charge.
    2. Single copies of full items can be:
       (a) reproduced, displayed or performed, and given to third parties in
    any format or medium
       (b) for personal research or study, educational, or not-for-profit
    purposes without prior permission or charge.
    provided:
       (a) the authors, title and full bibliographic details are given
       (b) a hyperlink and/or URL are given for the original metadata page
       (c) the content is not changed in any way
    3. Full items must not be harvested by robots except transiently for
    full-text indexing or citation analysis
    4. Full items must not be sold commercially in any format or medium.
    5. Some full items are individually tagged with different rights
    permissions and conditions.
    6. This repository is not the publisher; it is merely the online
    archive.
    7. Mention of the repository is appreciated but not mandatory.
    </text>
            </dataPolicy>
            <submissionPolicy>
              <text>1. Items may only be deposited by accredited members of the institution
    2. Authors may only submit their own work for archiving.
    3. Eligible depositors must deposit bibliographic metadata for all their
    publications.
    4. Eligible depositors must deposit full texts of all their
    publications, although they may delay making them publicly visible to
    comply with publishers' embargos.
    5. The administrator only vets items for the eligibility of
    authors/depositors, relevance to the scope of the repository, valid
    layout &amp; format, and the exclusion of spam
    6. The validity and authenticity of the content of submissions is the
    sole responsibility of the depositor.
    7. Items can be deposited at any time, but will not be made publicly
    visible until any publishers' or funders' embargo period has expired.
    8. Any copyright violations are entirely the responsibility of the
    authors/depositors.
    9. If the repository receives proof of copyright violation, the relevant
    item will be removed immediately.
    </text>
            </submissionPolicy>
            <comment>1. Items will be retained indefinitely.
    2. The repository will try to ensure continued readability and
    accessibility.
       (a) It may not be possible to guarantee the readability of some
    unusual file formats.
    3. The repository regularly backs up its files according to current best
    practice.
    4. The original bit stream is retained for all items, in addition to any
    upgraded formats.
    5. Items may be removed at the request of the author/copyright holder,
    but this is strongly discouraged.
    6. Acceptable reasons for withdrawal include:
       (a) Journal publishers' rules
       (b) Proven copyright violation or plagiarism
       (c) Legal requirements and proven violations
       (d) National Security
       (e) Falsified research
    7. Withdrawn items are not deleted per se, but are removed from public
    view.
    8. Withdrawn items' identifiers/URLs are retained indefinitely.
    9. URLs will continue to point to 'tombstone' citations, to avoid broken
    links and to retain item histories, with:
       (a) a link to a replacement version, where available
       (b) a note explaining the reasons for withdrawal
    10. The metadata of withdrawn items will not be searchable.
    11. Changes to deposited items are not permitted.
    12. Errata and corrigenda lists may be included with the original record
    if required.
    13. If necessary, an updated version may be deposited.
       (a) The earlier version may be withdrawn from public view.
       (b) The item's persistent URL will always link to the latest version.
       (c) There will be links between earlier and later versions, with the
    most recent version clearly identified.
    14. In the event of the repository being closed down, the database will
    be transferred to another appropriate archive.
    </comment>
