generated: '2026-09-01'
method: derived
source: >-
  Live probes of University of Reading hosts and of the identifier registries and identity
  federations the institution is registered in, 2026-09-01. Each entry below names the exact URL
  that was fetched and what it returned.
regime: education
note: >-
  Conformance for a university is mostly a question about SOMEONE ELSE'S software running under the
  institution's name, so every entry here says which host the evidence came from. A standard is
  marked conforms:true only where a live response from a University of Reading host, or a registry
  record naming the University of Reading, was actually retrieved. Nothing here is inferred from a
  prose claim on a web page.
standards:
- id: oai-pmh
  conforms: true
  evidence: >-
    Two live OAI-PMH 2.0 endpoints on the university's own hosts.
    https://centaur.reading.ac.uk/cgi/oai2?verb=Identify returned 200 text/xml with
    repositoryName "CentAUR", protocolVersion 2.0, repositoryIdentifier centaur.reading.ac.uk,
    granularity YYYY-MM-DDThh:mm:ssZ, deletedRecord persistent.
    https://researchdata.reading.ac.uk/cgi/oai2?verb=Identify returned 200 with repositoryName
    "University of Reading Research Data Archive". ListMetadataFormats, ListSets and ListRecords
    were each exercised: CentAUR advertises didl, mets, oai_bibl, oai_dc, rdf, rioxx and uketd_dc,
    and ListRecords with metadataPrefix=oai_dc returned 100 records plus a resumptionToken with
    completeListSize="64458". Captured responses are in examples/.
- id: saml
  conforms: true
  evidence: >-
    The University of Reading operates a SAML 2.0 identity provider entity registered in the UK
    Access Management Federation. entityID https://reading.ac.uk/oala/metadata; its metadata is
    served by the federation's MDQ service at
    http://mdq.ukfederation.org.uk/entities/%7Bsha1%7D57cf958ecb2c90e4fb339c8cf8a95dcee2d68101
    (200, application/samlmetadata+xml, 7,773 bytes), carrying
    OrganizationName "The University of Reading", scope reading.ac.uk plus reading.edu.my, and a
    SAML 2.0 HTTP-Redirect SingleSignOnService at
    https://login.openathens.net/saml/2/sso/reading.ac.uk/c/ukfed. The entity is also present in
    eduGAIN metadata (registrationAuthority http://ukfederation.org.uk).
- id: shibboleth
  conforms: partial
  evidence: >-
    The federation metadata for https://reading.ac.uk/oala/metadata declares a Shibboleth 1.0
    profile endpoint (Binding urn:mace:shibboleth:1.0:profiles:AuthnRequest at
    https://login.openathens.net/saml/1/sso/reading.ac.uk/c/ukfed), so the entity is
    Shibboleth-profile interoperable within the UK federation. Partial, not true, because the
    implementation behind it is OpenAthens LA rather than a Shibboleth IdP the university runs on
    its own host: no idp.reading.ac.uk, sso.reading.ac.uk or shib.reading.ac.uk resolves in DNS.
- id: datacite
  conforms: true
  evidence: >-
    The University of Reading is a DataCite member. https://api.datacite.org/providers/pclw returns
    a provider record named "University of Reading", symbol PCLW, organizationType
    academicInstitution, memberType consortium_organization, country GB, rorId
    https://ror.org/05v62cm79, joined under consortium blco, with DOI prefixes 10.17864, 10.48683,
    10.83281 and 10.83004 and repository clients bl.reading (URL http://researchdata.reading.ac.uk/)
    and pclw.bnuteb. DOIs minted under the institution appear in the CentAUR OAI-PMH oai_dc output.
- id: crossref
  conforms: false
  evidence: >-
    https://api.crossref.org/members?query=university+of+reading returned total-results 0 — the
    institution is not a Crossref member in its own name. Its scholarly identifiers are DataCite's.
- id: orcid
  conforms: unknown
  evidence: >-
    No machine-readable evidence of an institutional ORCID membership or an ORCID integration
    endpoint was retrieved. The CentAUR OAI-PMH oai_dc output carries no ORCID iDs in dc:creator,
    and no public ORCID member record naming the university was reachable without credentials.
    Recorded as unknown rather than false: UK institutional ORCID membership is normally held
    through the Jisc consortium and is not published in a form a public probe can confirm.
- id: lti
  conforms: false
  evidence: >-
    No public LTI registration, JWKS or platform-configuration endpoint was reachable on any
    reading.ac.uk host. Certificate-transparency records show bb.reading.ac.uk and
    ltipracticecourses.reading.ac.uk, which suggest LTI tools are used inside the Blackboard VLE,
    but a hostname is not a conformance claim and neither host serves an unauthenticated LTI
    surface.
- id: scim
  conforms: false
  evidence: >-
    No /scim/v2 or ServiceProviderConfig endpoint responded on any reading.ac.uk host probed. The
    institution's identity plane is a Microsoft Entra ID tenant (tenant id
    4ffa3bc4-ecfc-48c0-9080-f5e43ff90e5f, discovery document live at
    https://login.microsoftonline.com/reading.ac.uk/v2.0/.well-known/openid-configuration), whose
    SCIM provisioning surface is Microsoft's and is not exposed publicly.
- id: oneroster
  conforms: false
  evidence: No OneRoster endpoint or IMS Global / 1EdTech conformance certification naming the University of Reading was found.
- id: ed-fi
  conforms: false
  evidence: Ed-Fi is a US K-12 data standard; it is not applicable to a UK higher-education provider and no Ed-Fi surface exists here.
- id: caliper
  conforms: false
  evidence: No Caliper Analytics event store or sensor endpoint is publicly exposed on any reading.ac.uk host.
- id: qti
  conforms: false
  evidence: No QTI assessment item bank or QTI service endpoint is publicly exposed; assessment runs inside the authenticated Blackboard VLE.
additional_standards:
- id: oidc
  conforms: true
  evidence: >-
    https://login.microsoftonline.com/reading.ac.uk/v2.0/.well-known/openid-configuration returns a
    complete OpenID Connect discovery document for the university's Entra ID tenant
    (issuer https://login.microsoftonline.com/4ffa3bc4-ecfc-48c0-9080-f5e43ff90e5f/v2.0). The
    tenant is Managed, and https://login.microsoftonline.com/getuserrealm.srf?login=test@reading.ac.uk&json=1
    returns FederationBrandName "University of Reading". The tenant is the institution's; the
    endpoint is Microsoft's.
- id: rioxx
  conforms: true
  evidence: >-
    CentAUR advertises the rioxx metadata prefix in its ListMetadataFormats response — the RIOXX
    application profile for UK research outputs, required for REF open-access reporting.
- id: uketd_dc
  conforms: true
  evidence: >-
    Both repositories advertise the uketd_dc metadata prefix (UK Electronic Theses and
    Dissertations Dublin Core) in ListMetadataFormats.
- id: dublin-core
  conforms: true
  evidence: oai_dc is served by both endpoints and was exercised via ListRecords on CentAUR.
- id: ror
  conforms: true
  evidence: >-
    https://api.ror.org/organizations?query=University+of+Reading returns ROR record
    https://ror.org/05v62cm79 with domain reading.ac.uk, established 1926, GRID grid.9435.b, ISNI
    0000 0004 0457 9566, Funder Registry (fundref) 501100000839, and one child organisation
    (COMET, https://ror.org/047d2d387).
- id: openapi
  conforms: false
  evidence: >-
    The University of Reading publishes no OpenAPI, AsyncAPI or apis.json document of its own. The
    OpenAPI files in this repository were derived by API Evangelist from live probes and are marked
    method:derived; they are not the institution's artifacts.
- id: rfc9116-security-txt
  conforms: false
  evidence: https://www.reading.ac.uk/.well-known/security.txt returns 404 (soft-routed to /search/404.htm).
- id: llms-txt
  conforms: false
  evidence: https://www.reading.ac.uk/llms.txt returns 404.
